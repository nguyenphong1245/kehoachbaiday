services:
  postgres:
    image: postgres:16-alpine
    container_name: khbd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-khbd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env file}
      POSTGRES_DB: ${POSTGRES_DB:-khbd}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - khbd-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-khbd} -d $${POSTGRES_DB:-khbd}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:community
    container_name: khbd-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_LOCAL_PASSWORD:-Khbd2025Neo4j}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - khbd-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    container_name: khbd-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Override database URL to point to Docker service name
      SQL_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-khbd}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-khbd}
      PISTON_API_URL: http://piston:2000/api/v2
      # Neo4j local (override cloud URI from .env)
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_LOCAL_PASSWORD:-Khbd2025Neo4j}
      # KG-LPV dùng CHUNG đồ thị hệ thống (khbd-neo4j) — không còn instance riêng.
      KG_LPV_NEO4J_URI: bolt://neo4j:7687
      KG_LPV_NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      KG_LPV_NEO4J_PASSWORD: ${NEO4J_LOCAL_PASSWORD:-Khbd2025Neo4j}
      KG_LPV_NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      # Production settings - override from root .env
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      # Skip migrations if DB is already migrated (set to true to skip)
      SKIP_MIGRATIONS: ${SKIP_MIGRATIONS:-false}
    ports:
      - "8000:8000"
    networks:
      - khbd-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    container_name: khbd-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - khbd-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy

  piston:
    image: ghcr.io/engineer-man/piston
    container_name: khbd-piston
    restart: unless-stopped
    # privileged required by isolate sandbox
    privileged: true
    networks:
      - khbd-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:2000/api/v2/runtimes',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - piston-packages:/piston/packages
    tmpfs:
      - /tmp:exec

networks:
  khbd-network:
    driver: bridge

volumes:
  postgres-data:
  neo4j-data:
  neo4j-logs:
  piston-packages:
